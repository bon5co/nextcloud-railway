# Client address recovery behind Railway's edge proxy.
#
# X-Forwarded-For arrives as "<client>, <edge>" and the edge hop rotates between
# requests, so any key built from the whole header changes constantly. Take the
# first address only, hand it to mod_remoteip as X-Real-IP (the header the stock
# image's remoteip.conf already reads), and trust Railway's CGNAT peer range so
# the rewrite actually fires.
SetEnvIfNoCase X-Forwarded-For "^[[:space:]]*([^,[:space:]]+)" RAILWAY_CLIENT_IP=$1
RequestHeader set X-Real-IP "%{RAILWAY_CLIENT_IP}e" env=RAILWAY_CLIENT_IP

RemoteIPInternalProxy 100.64.0.0/10
RemoteIPInternalProxy fd00::/8
