# Client address recovery behind Railway's edge proxy.
#
# X-Forwarded-For arrives as "<client>, <edge>" and the edge hop rotates between
# requests, so any key built from the whole header changes every few requests.
# Take the first address only and republish it as X-Real-IP, which Nextcloud is
# told to read (forwarded_for_headers, set by the before-starting hook).
#
# This deliberately does NOT go through mod_remoteip: that module runs at
# post-read-request, before mod_headers has rewritten anything, so a RequestHeader
# written here is invisible to it. PHP sees the finished header set, which is all
# Nextcloud needs.
SetEnvIfNoCase X-Forwarded-For "^[[:space:]]*([^,[:space:]]+)" RAILWAY_CLIENT_IP=$1
RequestHeader set X-Real-IP "%{RAILWAY_CLIENT_IP}e" env=RAILWAY_CLIENT_IP
